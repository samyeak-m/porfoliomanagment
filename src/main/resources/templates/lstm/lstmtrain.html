<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LSTM Training Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        #metrics { white-space: pre; background: #f5f5f5; padding: 1em; border-radius: 5px; }
        .chart-container { 
            width: 600px; 
            height: 400px;
            margin: 20px auto; 
            position: relative;
        }
        .chart-container canvas {
            max-width: 100%;
            max-height: 100%;
        }
        #status { 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 5px;
            font-weight: bold;
        }
        .training { background-color: #fef9e7; color: #8b6914; border: 1px solid #fad5a5; }
        .completed { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        
        /* FIXED: Add styles for training info section */
        #training-info {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 1.5rem;
            margin: 1.5rem 0;
        }
        
        #training-info h3 {
            color: #495057;
            margin-bottom: 1rem;
            font-size: 1.2rem;
            border-bottom: 2px solid #4338ca;
            padding-bottom: 0.5rem;
        }
        
        #training-info p {
            margin: 0.5rem 0;
            color: #6c757d;
        }
        
        #training-info strong {
            color: #212529;
        }
    </style>
</head>
<body>
    <h1>LSTM Training Dashboard</h1>
    <button id="trainBtn">Start Training</button>
    <button id="incrementalBtn">Incremental Learning</button>
    <div id="status"></div>
    <div id="progressContainer" style="display: none;">
        <div style="background: #f0f0f0; border-radius: 10px; padding: 3px;">
            <div id="progressBar" style="background: #4CAF50; height: 20px; border-radius: 7px; width: 0%; transition: width 0.3s;"></div>
        </div>
        <div id="progressText">0%</div>
    </div>
    
    <!-- FIXED: Move training info section ABOVE metrics -->
    <div id="training-info"></div>
    
    <h2>Training Metrics</h2>
    <div id="metrics"></div>
    <div class="chart-container">
        <canvas id="accuracyChart"></canvas>
    </div>
    <div class="chart-container">
        <canvas id="lossChart"></canvas>
    </div>
    
    <script>
        const trainBtn = document.getElementById('trainBtn');
        const incrementalBtn = document.getElementById('incrementalBtn');
        const statusDiv = document.getElementById('status');
        const metricsDiv = document.getElementById('metrics');
        let trainingInProgress = false;
        let progressInterval = null;

        trainBtn.onclick = async () => {
            trainingInProgress = true;
            trainBtn.disabled = true;
            incrementalBtn.disabled = true;
            
            // Start real-time progress monitoring
            startProgressMonitoring();
            
            try {
                const response = await fetch('/api/lstm/train', { method: 'POST' });
                if (response.ok) {
                    stopProgressMonitoring();
                    statusDiv.textContent = "Training completed successfully!";
                    statusDiv.className = 'completed';
                    await fetchMetrics();
                    await fetchTrainingStatus(); // Refresh status after training
                } else {
                    throw new Error('Training failed');
                }
            } catch (error) {
                stopProgressMonitoring();
                statusDiv.textContent = "Training failed: " + error.message;
                statusDiv.className = 'error';
            } finally {
                trainingInProgress = false;
                trainBtn.disabled = false;
                incrementalBtn.disabled = false;
            }
        };

        function startProgressMonitoring() {
            statusDiv.className = 'training';
            document.getElementById('progressContainer').style.display = 'block';
            
            // Poll for progress every 2 seconds
            progressInterval = setInterval(async () => {
                try {
                    const response = await fetch('/api/lstm/training-progress');
                    if (response.ok) {
                        const progress = await response.json();
                        updateProgressDisplay(progress);
                        
                        // Stop polling when training is complete
                        if (!progress.isTraining && progress.progress >= 100) {
                            stopProgressMonitoring();
                        }
                    }
                } catch (error) {
                    console.error('Error fetching progress:', error);
                }
            }, 2000); // Poll every 2 seconds
        }

        function updateProgressDisplay(progress) {
            // Update status message
            statusDiv.textContent = progress.currentMessage;
            
            // Update progress bar
            const progressPercent = Math.min(progress.progress, 100);
            document.getElementById('progressBar').style.width = progressPercent + '%';
            
            // Update progress text with detailed info
            let progressText = Math.round(progressPercent) + '%';
            if (progress.currentEpoch > 0) {
                progressText += ` (Epoch ${progress.currentEpoch}/${progress.totalEpochs})`;
            }
            if (progress.estimatedTimeRemaining && progress.estimatedTimeRemaining !== 'Unknown') {
                progressText += ` - ETA: ${progress.estimatedTimeRemaining}`;
            }
            
            document.getElementById('progressText').textContent = progressText;
            
            // Debug log
            console.log('Training Progress:', progress);
        }

        function stopProgressMonitoring() {
            if (progressInterval) {
                clearInterval(progressInterval);
                progressInterval = null;
            }
            
            // Final progress update
            document.getElementById('progressBar').style.width = '100%';
            document.getElementById('progressText').textContent = '100%';
        }

        // Incremental learning with real-time updates
        incrementalBtn.onclick = async () => {
            statusDiv.textContent = "Starting incremental learning...";
            statusDiv.className = 'training';
            incrementalBtn.disabled = true;
            
            try {
                await fetch('/api/lstm/incremental-train', { method: 'POST' });
                statusDiv.textContent = "Incremental learning completed!";
                statusDiv.className = 'completed';
                await fetchMetrics();
                await fetchTrainingStatus(); // Refresh status after incremental training
            } catch (error) {
                statusDiv.textContent = "Incremental learning failed: " + error.message;
                statusDiv.className = 'error';
            } finally {
                incrementalBtn.disabled = false;
            }
        };

        async function fetchMetrics() {
            try {
                const res = await fetch('/api/lstm/metrics');
                
                if (res.ok) {
                    const contentType = res.headers.get('content-type');
                    
                    if (contentType && contentType.includes('application/json')) {
                        // Handle JSON response (model not trained)
                        const jsonResponse = await res.json();
                        if (jsonResponse.status === 'not_trained') {
                            metricsDiv.textContent = `${jsonResponse.message}\n\n${jsonResponse.instruction}`;
                            metricsDiv.style.fontStyle = 'italic';
                            metricsDiv.style.color = '#666';
                        } else {
                            metricsDiv.textContent = jsonResponse.message || 'Unknown error occurred';
                        }
                    } else {
                        // Handle text response (metrics file content)
                        const text = await res.text();
                        metricsDiv.textContent = text;
                        metricsDiv.style.fontStyle = 'normal';
                        metricsDiv.style.color = 'inherit';
                        updateCharts(text);
                    }
                } else {
                    metricsDiv.textContent = 'Failed to load metrics. Please try again.';
                }
            } catch (error) {
                console.error('Error fetching metrics:', error);
                metricsDiv.textContent = 'Model not trained yet. Please train the model first to view metrics.';
            }
        }

        function updateCharts(metricsText) {
            try {
                const accData = [];
                const lossData = [];
                const valAccData = [];
                const valLossData = [];
                const epochs = [];
                const lines = metricsText.split('\n');
                
                lines.forEach(line => {
                    // FIXED: Multiple regex patterns to match different log formats
                    const patterns = [
                        /Epoch\s+(\d+):\s*Accuracy\s*=\s*([\d.]+),\s*Loss\s*=\s*([\d.]+),\s*Validation\s+Accuracy\s*=\s*([\d.]+),\s*Validation\s+Loss\s*=\s*([\d.]+)/,
                        /Epoch\s+(\d+):\s*Accuracy\s*=\s*([\d.]+),\s*Loss\s*=\s*([\d.]+),\s*Val_Accuracy\s*=\s*([\d.]+),\s*Val_Loss\s*=\s*([\d.]+)/,
                        /Epoch\s+(\d+)\s*:\s*Accuracy\s*=\s*([\d.]+),\s*Loss\s*=\s*([\d.]+),\s*Val.*Accuracy\s*=\s*([\d.]+),\s*Val.*Loss\s*=\s*([\d.]+)/
                    ];
                    
                    for (let pattern of patterns) {
                        const match = line.match(pattern);
                        if (match) {
                            epochs.push(Number(match[1]));
                            accData.push(Number(match[2]));
                            lossData.push(Number(match[3]));
                            valAccData.push(Number(match[4]));
                            valLossData.push(Number(match[5]));
                            break;
                        }
                    }
                });
                
                if (epochs.length > 0) {
                    console.log(`Updating charts with ${epochs.length} data points`);
                    drawChart('accuracyChart', 'Accuracy', epochs, accData, valAccData);
                    drawChart('lossChart', 'Loss', epochs, lossData, valLossData);
                    console.log(`Charts updated successfully`);
                } else {
                    console.log("No chart data found. Sample lines:");
                    lines.filter(l => l.includes('Epoch')).slice(0, 3).forEach(line => console.log(line));
                }
            } catch (error) {
                console.error('Error in updateCharts:', error);
                console.error('Error stack:', error.stack);
            }
        }

        function drawChart(canvasId, label, epochs, trainData, valData) {
            console.log('Drawing chart for:', canvasId);
            
            const canvasElement = document.getElementById(canvasId);
            if (!canvasElement) {
                console.error('Canvas element not found:', canvasId);
                return;
            }
            
            const ctx = canvasElement.getContext('2d');
            
            // Enhanced error checking
            if (window[canvasId]) {
                console.log('Existing chart found for:', canvasId, typeof window[canvasId]);
                if (typeof window[canvasId].destroy === 'function') {
                    console.log('Destroying existing chart');
                    window[canvasId].destroy();
                } else {
                    console.warn('Chart object exists but destroy method not found');
                    delete window[canvasId];
                }
            }
            
            try {
                // Create new chart
                window[canvasId] = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: epochs,
                        datasets: [
                            { label: 'Train ' + label, data: trainData, borderColor: 'green', fill: false },
                            { label: 'Validation ' + label, data: valData, borderColor: 'red', fill: false }
                        ]
                    },
                    options: {
                        responsive: true,
                        scales: { x: { title: { display: true, text: 'Epoch' } } }
                    }
                });
                console.log('Chart created successfully for:', canvasId);
            } catch (error) {
                console.error('Error creating chart:', error);
            }
        }

        async function fetchTrainingStatus() {
            try {
                const res = await fetch('/api/lstm/training-status');
                const status = await res.json();
                
                // FIXED: Enhanced training status display
                document.getElementById('training-info').innerHTML = `
                    <h3>🔧 Training Status</h3>
                    <p><strong>Last Training:</strong> ${status.lastTrainingDate || 'Never'}</p>
                    <p><strong>Days Since Training:</strong> ${status.daysSinceTraining || 0}</p>
                    <p><strong>Model Exists:</strong> ${status.modelExists ? '✅ Yes' : '❌ No'}</p>
                    <p><strong>Next Training Type:</strong> ${status.needsIncremental ? '🔄 Incremental Learning' : '✅ Use Existing Model'}</p>
                    <p><strong>Model Version:</strong> ${status.version || 'N/A'}</p>
                    <p><strong>Hidden Size:</strong> ${status.hiddenSize || 'N/A'}</p>
                    <p><strong>Input Size:</strong> ${status.inputSize || 'N/A'}</p>
                    ${status.modelSize ? `<p><strong>Model Size:</strong> ${status.modelSize}</p>` : ''}
                `;
            } catch (error) {
                console.error('Error fetching training status:', error);
                document.getElementById('training-info').innerHTML = `
                    <h3>🔧 Training Status</h3>
                    <p style="color: #dc3545;"><strong>Error:</strong> Failed to load training status</p>
                `;
            }
        }

        // Initialize page - fetch once on load
        window.addEventListener('DOMContentLoaded', async () => {
            await fetchTrainingStatus(); // This will now appear ABOVE metrics
            await fetchMetrics(); // Initial metrics load
        });
    </script>
</body>
</html>

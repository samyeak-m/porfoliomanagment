<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Stock Prediction - Portfolio Management</title>
    <link rel="stylesheet" href="/css/lstm/lstmpredict.css">
</head>

<body>
    <!-- Include the main header -->
    <div th:replace="~{layout/header :: header}"></div>

    <div class="container">
        <!-- Enhanced Page Banner -->
        <div class="page-banner">
            <h1>AI Stock Prediction</h1>
            <p>Advanced LSTM neural network predictions for NEPSE stocks</p>
        </div>

        <!-- Main Prediction Card -->
        <div class="prediction-card">
            <div class="card-header">
                <h2>Stock Analysis & Prediction</h2>
            </div>
            <div class="card-body">
                <form id="predict-form">
                    <div class="form-group">
                        <label for="stockSymbol">Stock Symbol</label>
                        <div class="stock-input-container" id="stockDropdown">
                            <input type="text" id="stockSymbol" name="stockSymbol" required
                                placeholder="Enter stock symbol (e.g., NTC, ADBL)" autocomplete="off">
                            <div class="stock-dropdown" id="stockDropdownList" style="display: none;">
                                <!-- Dropdown items will be populated by JavaScript -->
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="predict-btn" id="predictBtn">
                        <span>Analyze Stock</span>
                    </button>
                </form>
            </div>
        </div>

        <!-- Results Container -->
        <div class="results-container">
            <div id="predictionResults" class="prediction-results">
                <!-- Results will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <script src="/js/lstm/lstmpredict.js"></script>
</body>

</html>

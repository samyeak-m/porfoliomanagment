<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Chart - Portfolio Management</title>
    <link rel="stylesheet" href="/css/trading/chart.css">
</head>
<body>
    <div th:replace="~{layout/header :: header}"></div>

    <div class="trading-container">
        <!-- Chart Controls -->
        <div class="chart-controls">
            <div class="control-group">
                <label for="symbolSelect">Stock Symbol:</label>
                <select id="symbolSelect">
                    <option value="">Select Symbol...</option>
                </select>
            </div>

            <div class="control-group">
                <label for="chartType">Chart Type:</label>
                <select id="chartType">
                    <option value="candlestick" selected>Candlestick</option>
                    <option value="line">Line</option>
                    <option value="area">Area</option>
                    <option value="bar">Bar</option>
                </select>
            </div>

            <button id="refreshBtn" class="control-btn control-btn-small">
                <span>Refresh</span>
            </button>
        </div>

        <!-- Main Chart Area -->
        <div class="chart-wrapper">
            <div id="mainChart" class="chart-area"></div>
            <div id="volumeChart" class="volume-area"></div>
        </div>

        <!-- Stock Info Panel -->
        <div class="info-panel">
            <h3 id="stockSymbol">-</h3>
            <div class="stock-stats">
                <div class="stat-item">
                    <span class="stat-label">Open:</span>
                    <span class="stat-value" id="openPrice">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">High:</span>
                    <span class="stat-value" id="highPrice">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Low:</span>
                    <span class="stat-value" id="lowPrice">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Close:</span>
                    <span class="stat-value" id="closePrice">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Change:</span>
                    <span class="stat-value" id="priceChange">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Volume:</span>
                    <span class="stat-value" id="volume">-</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
    <script src="/js/trading/chart.js"></script>
</body>
</html>

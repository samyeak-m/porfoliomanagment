<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VaR Risk Analysis - Portfolio Management</title>
    <link rel="stylesheet" href="/css/var/var-modern.css">
</head>

<body>
    <div th:replace="~{layout/header :: header}"></div>

    <div class="container">
        <div class="page-banner">
            <h1>Value at Risk Analysis</h1>
            <p>Monte Carlo simulation for comprehensive risk assessment of NEPSE stocks</p>
        </div>

        <div class="var-card">
            <div class="card-header">
                <h2>Risk Analysis & VaR Calculation</h2>
            </div>
            <div class="card-body">
                <form id="var-form">
                    <div class="form-group">
                        <label for="stockSymbol">Stock Symbol</label>
                        <div class="stock-input-container" id="stockDropdown">
                            <input type="text" id="stockSymbol" name="stockSymbol" required
                                placeholder="Enter stock symbol (e.g., NTC, ADBL)" autocomplete="off">
                            <div class="stock-dropdown" id="stockDropdownList" style="display: none;">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="periodValue">Investment Period</label>
                        <div style="display: flex; gap: 12px;">
                            <input type="number" id="periodValue" name="periodValue" min="1" required
                                placeholder="Enter period" value="25" style="flex: 2;">
                            <select id="periodUnit" name="periodUnit" style="flex: 1;">
                                <option value="days">Days</option>
                                <option value="weeks">Weeks</option>
                                <option value="months">Months</option>
                                <option value="years">Years</option>
                            </select>
                        </div>
                        <small class="input-help">Specify your investment timeframe (e.g., 30 days, 6 months, 2 years)</small>
                    </div>

                    <button type="submit" class="var-btn" id="varBtn">
                        <span>Calculate Value at Risk</span>
                    </button>
                </form>
            </div>
        </div>

        <div class="results-container">
            <div id="varResults" class="var-results">
            </div>
        </div>
    </div>

    <script src="/js/var/var-calculation.js"></script>
</body>

</html>
